server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    # Redirects like /game -> /game/ keep whatever host and port the browser used.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API กลาง
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Simulation (Net-Desktop): /sim/xxx -> sim:3000/xxx
    location = /sim { return 301 /sim/; }
    location /sim/ {
        proxy_pass http://sim:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # เกม NetSim3D (Godot Web) จากโฟลเดอร์ game-build
    # .wasm และ .pck บีบอัดไว้ก่อนแล้ว (.gz) จึงไม่ต้องบีบทุกครั้งที่มีคนโหลด
    location = /game { return 301 /game/; }
    location /game/ {
        alias /srv/game/;
        index index.html;
        gzip_static on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # ไฟล์ของหน้าเว็บหลักที่ชื่อมีรหัสเวอร์ชัน แคชได้นาน
    location /assets/ {
        root /srv/web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # หน้าเว็บหลัก (React): ทุกเส้นทางที่ไม่ใช่ไฟล์ส่งไปที่ index.html
    location / {
        root /srv/web;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
